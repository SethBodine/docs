    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DocScan",
      "alternateName": "DocScan — Document Security Analyser",
      "url": "https://docs.insecure.co.nz/",
      "description": "A free, browser-based document and file security analyser. Scans PDF, Office documents, archives (ZIP/7Z/RAR/TAR and more), config/credential files, PE/ELF binaries, and PCAP network captures for macros, exploits, embedded secrets, and format spoofing. All parsing happens client-side using JavaScript and WebAssembly; file contents are never uploaded to a server.",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Any (runs in a modern web browser)",
      "browserRequirements": "Requires JavaScript and WebAssembly support. Works in current versions of Chrome, Edge, Firefox and Safari.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": [
        "PDF, DOCX, XLSX, PPTX macro and active-content detection",
        "Recursive archive scanning (ZIP, TAR, GZIP, BZIP2, XZ, 7-Zip, RAR)",
        "PE (EXE/DLL) and ELF binary structural parsing",
        "PCAP/PCAPNG network capture analysis (TCP reassembly, TLS/JA3, DNS, HTTP)",
        "Credential and secret scanning with confirmed-vs-potential classification",
        "File-type spoofing detection via byte-signature verification"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is my file ever uploaded to a server?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Every parser runs entirely in your browser using JavaScript and WebAssembly. File contents are never transmitted anywhere. Only opt-in usage metadata, never file contents, may be logged." }
        },
        {
          "@type": "Question",
          "name": "What file types does DocScan support?",
          "acceptedAnswer": { "@type": "Answer", "text": "PDF, DOCX/DOC, XLSX/XLS/XLSM, PPTX/PPT, HTML, CSV, XML/SVG, RTF, HAR, JAR, ZIP/TAR/GZIP/BZIP2/XZ, 7-Zip/RAR, env/config/credential files, PEM/keys/certificates, EXE/DLL/SYS (PE), ELF binaries, Mach-O, and PCAP/PCAPNG network captures. Any other file type still gets a generic secret scan." }
        },
        {
          "@type": "Question",
          "name": "What is Format Spoofing?",
          "acceptedAnswer": { "@type": "Answer", "text": "DocScan checks a file's actual byte signature against its file extension. A renamed or disguised file, such as an executable saved with a .pdf extension, is still identified correctly and flagged as a Format Spoofing finding." }
        },
        {
          "@type": "Question",
          "name": "Does DocScan detect malware?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. It reports structural and behavioural signals as things to weigh, not verdicts, and does not attempt malware-family identification or scoring." }
        }
      ]
    }
    </script>

    <div id="root"></div>
    <noscript>
      <div style="max-width: 700px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; color: #e6edf3; background: #0d1117;">
        <h1>DocScan — Document Security Analyser</h1>
        <p>A free, browser-based tool that scans documents, archives, binaries and network captures for macros, exploits, embedded secrets, and format spoofing. This app requires JavaScript and WebAssembly — please enable them to use it.</p>
        <h2>What it checks</h2>
        <ul>
          <li>PDF, DOCX, XLSX and PPTX for macros, embedded objects, and active content</li>
          <li>Archives (ZIP, TAR, GZIP, BZIP2, XZ, 7-Zip, RAR) recursively, up to 5 levels deep</li>
          <li>Config and credential files (.env, AWS/GCP/Azure credentials, kubeconfig) for exposed secrets</li>
          <li>PE (EXE/DLL) and ELF binaries for suspicious imports and structure</li>
          <li>PCAP/PCAPNG network captures for TLS/JA3, DNS, HTTP and cleartext credentials</li>
          <li>Any file for a renamed or spoofed file type, by checking real byte signatures</li>
        </ul>
        <p>All analysis happens locally in your browser — file contents are never uploaded to a server.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
